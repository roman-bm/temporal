# Model registry for the orchestration council.
#
# Every field here is editable — provider model IDs move fast, so if a live call
# 404s, change `model_id` below rather than touching the code.
#
# provider:
#   anthropic     -> official Anthropic SDK
#   openai_compat -> any OpenAI-compatible /chat/completions endpoint
#
# weight:          base voting weight in the consensus math (0.5 - 1.5)
# can_orchestrate: may be selected as the main model
# lens:            the default analytical bias this model is briefed to hold.
#                  The orchestrator may override it per task.

defaults:
  temperature: 0.7
  max_tokens: 4000
  timeout_s: 180

models:
  - key: claude-opus-5
    name: Claude Opus 5
    vendor: Anthropic
    provider: anthropic
    model_id: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY
    weight: 1.5
    can_orchestrate: true
    supports_json_mode: false
    effort: high
    lens: systems-architecture
    strengths: [long-horizon reasoning, agentic planning, code, synthesis]

  - key: claude-fable-5
    name: Claude Fable 5
    vendor: Anthropic
    provider: anthropic
    model_id: claude-fable-5
    api_key_env: ANTHROPIC_API_KEY
    weight: 1.5
    can_orchestrate: true
    supports_json_mode: false
    effort: high
    lens: first-principles
    strengths: [hardest reasoning, long-horizon autonomy, ambiguity]

  - key: claude-sonnet-5
