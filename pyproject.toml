[project]
name = "orchestra-council"
version = "0.1.0"
description = "A council of frontier models that negotiate under a chair model you choose"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
orchestra = "orchestra.cli:main"
orchestra-server = "orchestra.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestra*"]

[tool.setuptools.package-data]
orchestra = ["models.yaml", "static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
