[project]
name = "orchestra-council"
version = "0.1.0"
description = "A council of frontier models that negotiate under a chair model you choose"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.scripts]
orchestra = "orchestra.cli:main"
orchestra-server = "orchestra.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestra*"]

[tool.setuptools.package-data]
orchestra = ["models.yaml", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep this list short on purpose: it should catch real mistakes, not enforce
# a house style that fights the existing code.
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # line length is handled by the formatter, not worth failing CI over
    "B008",  # FastAPI's Depends() idiom is a function call in a default arg
    "UP042", # (str, Enum) is deliberate: it serialises identically to StrEnum
             # for our purposes and swapping it churns working JSON paths for
             # no behavioural gain.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
