name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint
        run: ruff check orchestra tests

      - name: Test
        # The suite must stay hermetic: no network, no API keys. Any test that
        # needs a provider is mocked. Clearing the keys here means a leaked
        # credential in the runner can never make a green build depend on it.
        env:
          ANTHROPIC_API_KEY: ""
          OPENAI_API_KEY: ""
        run: pytest -q

      - name: Smoke-test the CLI end to end
        # Catches wiring that unit tests miss — entry points, arg parsing,
        # report rendering — using the simulator so it costs nothing.
        run: |
          python -m orchestra.cli models
          python -m orchestra.cli run "Should we adopt a monorepo?" \
            --simulate -n 4 -r 1 --quiet -o /tmp/report.md
          test -s /tmp/report.md
          grep -q "Claim ledger" /tmp/report.md

      - name: Preflight reports no usable models without keys
        # doctor exits non-zero when a council cannot run. With no keys
        # configured that is the correct answer, so invert the check.
        run: |
          if python -m orchestra.cli doctor; then
            echo "doctor should have failed with no keys configured" && exit 1
          fi
